version: '3.1'

services:
  db:
    image: postgres:15
    container_name: intern-app
    restart: always
    environment:
      POSTGRES_DB: intern_db
      POSTGRES_USER: intern_user
      POSTGRES_PASSWORD: intern_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
